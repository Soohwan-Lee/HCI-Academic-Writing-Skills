<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="408" viewBox="0 0 1000 408" role="img" aria-labelledby="title desc">
<title id="title">Separate the contribution, then connect four levels of prose</title>
<desc id="desc">Separate contribution from method, topic, venue and format; then plan Section: What must the reader understand here? → Subsection: What needs to be explained first? → Paragraph: What claim, evidence or interpretation advances? → Sentence: What carries forward, and what is new?</desc>
<defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.65" fill="#dfd9cd"/></pattern></defs>
<rect x="0.75" y="0.75" width="998.5" height="406.5" rx="20" fill="#f7f5ef" stroke="#dedad0" stroke-width="1.5"/>
<rect x="1.5" y="1.5" width="997" height="405" rx="19" fill="url(#dots)"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif">
<text x="28" y="34" font-size="11" font-weight="700" letter-spacing="1.8" fill="#65736d">HOW THE SKILL PLANS A MANUSCRIPT</text>
<text x="28" y="66" font-size="25" font-weight="700" fill="#173f3c">Separate the contribution, then connect four levels of prose</text>
<g transform="translate(28,92)">
<rect width="252" height="292" rx="14" fill="#173f3c"/>
<rect x="20" y="20" width="64" height="22" rx="5" fill="#255450"/>
<text x="52" y="35" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#cfe0da">ANCHOR</text>
<text x="20" y="72" font-size="21" font-weight="700" fill="#ffffff">Contribution first</text>
<text x="20" y="100" font-size="13.5" fill="#cde0da">Separate what the paper adds</text>
<text x="20" y="119" font-size="13.5" fill="#cde0da">from four independent choices:</text>
<rect x="20" y="138" width="100" height="30" rx="7" fill="#204d49" stroke="#366a65"/>
<text x="70" y="158" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6f0ec">Method</text>
<rect x="128" y="138" width="100" height="30" rx="7" fill="#204d49" stroke="#366a65"/>
<text x="178" y="158" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6f0ec">Topic</text>
<rect x="20" y="176" width="100" height="30" rx="7" fill="#204d49" stroke="#366a65"/>
<text x="70" y="196" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6f0ec">Venue</text>
<rect x="128" y="176" width="100" height="30" rx="7" fill="#204d49" stroke="#366a65"/>
<text x="178" y="196" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6f0ec">Format</text>
<line x1="20" y1="228" x2="232" y2="228" stroke="#2c5b56"/>
<circle cx="26" cy="249" r="3.5" fill="#d27759"/>
<text x="36" y="253" font-size="12.5" fill="#ebd6cc">Same method or venue can</text>
<text x="36" y="272" font-size="12.5" fill="#ebd6cc">need a different structure.</text>
</g>
<line x1="280" y1="124" x2="314" y2="124" stroke="#b75b3e" stroke-width="2"/>
<circle cx="280" cy="124" r="3.5" fill="#b75b3e"/>
<polygon points="316,124 309,119.5 309,128.5" fill="#b75b3e"/>
<g transform="translate(316,92)">
<rect width="656" height="64" rx="10" fill="#ffffff" stroke="#dcd9cf"/>
<rect x="16" y="19" width="32" height="26" rx="6" fill="#b75b3e"/>
<text x="32" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">01</text>
<text x="60" y="39" font-size="19" font-weight="700" fill="#173f3c">Section</text>
<line x1="184" y1="14" x2="184" y2="50" stroke="#e5e2d8"/>
<text x="202" y="27" font-size="15.5" font-weight="600" fill="#223835">Give the argument a purpose.</text>
<text x="202" y="48" font-size="13.5" fill="#5a6963">What must the reader understand here?</text>
</g>
<path d="M327 156 V200 H335" fill="none" stroke="#b75b3e" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="338,200 331.5,196 331.5,204" fill="#b75b3e"/>
<g transform="translate(338,168)">
<rect width="634" height="64" rx="10" fill="#ffffff" stroke="#dcd9cf"/>
<rect x="16" y="19" width="32" height="26" rx="6" fill="#b75b3e"/>
<text x="32" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">02</text>
<text x="60" y="39" font-size="19" font-weight="700" fill="#173f3c">Subsection</text>
<line x1="184" y1="14" x2="184" y2="50" stroke="#e5e2d8"/>
<text x="202" y="27" font-size="15.5" font-weight="600" fill="#223835">Order the questions.</text>
<text x="202" y="48" font-size="13.5" fill="#5a6963">What needs to be explained first?</text>
</g>
<path d="M349 232 V276 H357" fill="none" stroke="#b75b3e" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="360,276 353.5,272 353.5,280" fill="#b75b3e"/>
<g transform="translate(360,244)">
<rect width="612" height="64" rx="10" fill="#ffffff" stroke="#dcd9cf"/>
<rect x="16" y="19" width="32" height="26" rx="6" fill="#b75b3e"/>
<text x="32" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">03</text>
<text x="60" y="39" font-size="19" font-weight="700" fill="#173f3c">Paragraph</text>
<line x1="184" y1="14" x2="184" y2="50" stroke="#e5e2d8"/>
<text x="202" y="27" font-size="15.5" font-weight="600" fill="#223835">Develop one meaningful step.</text>
<text x="202" y="48" font-size="13.5" fill="#5a6963">What claim, evidence or interpretation advances?</text>
</g>
<path d="M371 308 V352 H379" fill="none" stroke="#b75b3e" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="382,352 375.5,348 375.5,356" fill="#b75b3e"/>
<g transform="translate(382,320)">
<rect width="590" height="64" rx="10" fill="#ffffff" stroke="#dcd9cf"/>
<rect x="16" y="19" width="32" height="26" rx="6" fill="#b75b3e"/>
<text x="32" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">04</text>
<text x="60" y="39" font-size="19" font-weight="700" fill="#173f3c">Sentence</text>
<line x1="184" y1="14" x2="184" y2="50" stroke="#e5e2d8"/>
<text x="202" y="27" font-size="15.5" font-weight="600" fill="#223835">Connect each inference.</text>
<text x="202" y="48" font-size="13.5" fill="#5a6963">What carries forward, and what is new?</text>
</g>
</g></svg>
