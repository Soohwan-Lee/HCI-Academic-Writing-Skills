<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="444" viewBox="0 0 1000 444" role="img" aria-labelledby="title desc">
<title id="title">From argument to prose</title>
<desc id="desc">Section: What must the reader understand here? → Subsection: What needs to be explained first? → Paragraph: What claim, evidence or interpretation advances? → Sentence: What carries forward, and what is new?</desc>
<defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.65" fill="#ddd8cc"/></pattern></defs>
<rect width="1000" height="444" rx="20" fill="#f7f5ef"/>
<rect width="1000" height="444" rx="20" fill="url(#dots)"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif">
<text x="28" y="35" font-size="11" font-weight="700" letter-spacing="2" fill="#65736d">FOUR LEVELS OF WRITING</text>
<text x="28" y="70" font-size="28" font-weight="700" fill="#173f3c">From argument to prose</text>
<g transform="translate(24,96)">
<rect width="464" height="144" rx="12" fill="#ffffff" stroke="#dddcd4"/>
<rect x="18" y="18" width="32" height="26" rx="6" fill="#b75b3e"/>
<text x="34" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">01</text>
<text x="62" y="39" font-size="22" font-weight="700" fill="#173f3c">Section</text>
<text x="20" y="81" font-size="17" font-weight="600" fill="#263c38">Give the argument a purpose.</text>
<text x="20" y="112" font-size="15" fill="#5a6963">What must the reader understand here?</text>
</g>
<g transform="translate(512,96)">
<rect width="464" height="144" rx="12" fill="#ffffff" stroke="#dddcd4"/>
<rect x="18" y="18" width="32" height="26" rx="6" fill="#b75b3e"/>
<text x="34" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">02</text>
<text x="62" y="39" font-size="22" font-weight="700" fill="#173f3c">Subsection</text>
<text x="20" y="81" font-size="17" font-weight="600" fill="#263c38">Order the questions.</text>
<text x="20" y="112" font-size="15" fill="#5a6963">What needs to be explained first?</text>
</g>
<g transform="translate(24,260)">
<rect width="464" height="144" rx="12" fill="#ffffff" stroke="#dddcd4"/>
<rect x="18" y="18" width="32" height="26" rx="6" fill="#b75b3e"/>
<text x="34" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">03</text>
<text x="62" y="39" font-size="22" font-weight="700" fill="#173f3c">Paragraph</text>
<text x="20" y="81" font-size="17" font-weight="600" fill="#263c38">Develop one meaningful step.</text>
<text x="20" y="112" font-size="15" fill="#5a6963">What claim, evidence or interpretation advances?</text>
</g>
<g transform="translate(512,260)">
<rect width="464" height="144" rx="12" fill="#173f3c" stroke="#173f3c"/>
<rect x="18" y="18" width="32" height="26" rx="6" fill="#b75b3e"/>
<text x="34" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">04</text>
<text x="62" y="39" font-size="22" font-weight="700" fill="#ffffff">Sentence</text>
<text x="20" y="81" font-size="17" font-weight="600" fill="#ffffff">Connect each inference.</text>
<text x="20" y="112" font-size="15" fill="#cdded7">What carries forward, and what is new?</text>
</g>
</g></svg>
