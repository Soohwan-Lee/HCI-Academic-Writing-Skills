<svg xmlns="http://www.w3.org/2000/svg" width="440" height="704" viewBox="0 0 440 704" role="img" aria-labelledby="title desc">
<title id="title">From contribution to connected prose</title>
<desc id="desc">Separate contribution from method, topic, venue and format; then plan Section: What must the reader understand here? → Subsection: What needs to be explained first? → Paragraph: What claim, evidence or interpretation advances? → Sentence: What carries forward, and what is new?</desc>
<defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.65" fill="#dfd9cd"/></pattern></defs>
<rect x="0.75" y="0.75" width="438.5" height="702.5" rx="20" fill="#f7f5ef" stroke="#dedad0" stroke-width="1.5"/>
<rect x="1.5" y="1.5" width="437" height="701" rx="19" fill="url(#dots)"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif">
<text x="22" y="33" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#65736d">HOW THE SKILL PLANS A MANUSCRIPT</text>
<text x="22" y="61" font-size="22" font-weight="700" fill="#173f3c">From contribution to connected prose</text>
<g transform="translate(20,80)">
<rect width="400" height="108" rx="12" fill="#173f3c"/>
<text x="18" y="31" font-size="18" font-weight="700" fill="#ffffff">Contribution first</text>
<rect x="320" y="14" width="62" height="21" rx="5" fill="#255450"/>
<text x="351" y="28" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.1" fill="#cfe0da">ANCHOR</text>
<text x="18" y="56" font-size="13" fill="#cde0da">Kept distinct from method · topic · venue · format</text>
<line x1="18" y1="71" x2="382" y2="71" stroke="#2c5b56"/>
<circle cx="23" cy="89" r="3" fill="#d27759"/>
<text x="32" y="93" font-size="12.5" fill="#ebd6cc">Same method or venue can need a different structure.</text>
</g>
<line x1="42" y1="188" x2="42" y2="204" stroke="#b75b3e" stroke-width="2"/>
<polygon points="42,206 37.5,199 46.5,199" fill="#b75b3e"/>
<g transform="translate(20,206)">
<rect width="400" height="110" rx="9" fill="#ffffff" stroke="#dcd9cf"/>
<rect x="16" y="15" width="30" height="24" rx="6" fill="#b75b3e"/>
<text x="31" y="31" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">01</text>
<text x="56" y="34" font-size="18.5" font-weight="700" fill="#173f3c">Section</text>
<text x="16" y="66" font-size="15" font-weight="600" fill="#223835">Give the argument a purpose.</text>
<text x="16" y="90" font-size="13" fill="#5a6963">What must the reader understand here?</text>
</g>
<path d="M29 316 V383 H35" fill="none" stroke="#b75b3e" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="38,383 32,379.2 32,386.8" fill="#b75b3e"/>
<g transform="translate(38,328)">
<rect width="382" height="110" rx="9" fill="#ffffff" stroke="#dcd9cf"/>
<rect x="16" y="15" width="30" height="24" rx="6" fill="#b75b3e"/>
<text x="31" y="31" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">02</text>
<text x="56" y="34" font-size="18.5" font-weight="700" fill="#173f3c">Subsection</text>
<text x="16" y="66" font-size="15" font-weight="600" fill="#223835">Order the questions.</text>
<text x="16" y="90" font-size="13" fill="#5a6963">What needs to be explained first?</text>
</g>
<path d="M47 438 V505 H53" fill="none" stroke="#b75b3e" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="56,505 50,501.2 50,508.8" fill="#b75b3e"/>
<g transform="translate(56,450)">
<rect width="364" height="110" rx="9" fill="#ffffff" stroke="#dcd9cf"/>
<rect x="16" y="15" width="30" height="24" rx="6" fill="#b75b3e"/>
<text x="31" y="31" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">03</text>
<text x="56" y="34" font-size="18.5" font-weight="700" fill="#173f3c">Paragraph</text>
<text x="16" y="66" font-size="15" font-weight="600" fill="#223835">Develop one meaningful step.</text>
<text x="16" y="90" font-size="13" fill="#5a6963">What claim, evidence or interpretation advances?</text>
</g>
<path d="M65 560 V627 H71" fill="none" stroke="#b75b3e" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="74,627 68,623.2 68,630.8" fill="#b75b3e"/>
<g transform="translate(74,572)">
<rect width="346" height="110" rx="9" fill="#ffffff" stroke="#dcd9cf"/>
<rect x="16" y="15" width="30" height="24" rx="6" fill="#b75b3e"/>
<text x="31" y="31" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">04</text>
<text x="56" y="34" font-size="18.5" font-weight="700" fill="#173f3c">Sentence</text>
<text x="16" y="66" font-size="15" font-weight="600" fill="#223835">Connect each inference.</text>
<text x="16" y="90" font-size="13" fill="#5a6963">What carries forward, and what is new?</text>
</g>
</g></svg>
